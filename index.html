<style>
  :root {
    --bg: #FBF5EA;
    --glow-1: transparent;
    --glow-2: transparent;
    --glow-3: transparent;
    --surface: #FFFDF8;
    --surface-solid: #FFFDF8;
    --surface-hover: #FFFFFF;
    --ink: #2E261F;
    --ink-2: #5E5247;
    --muted: #7D7064;
    --line: #EDE3D3;
    --line-strong: #DDCFBA;
    --h: 221;
    --accent: hsl(var(--h) 80% 52%);
    --accent-2: hsl(calc(var(--h) - 28) 78% 55%);
    --accent-ink: #FFFFFF;
    --accent-soft: hsl(var(--h) 80% 52% / .11);
    --ok: #16A34A;
    --warn: #B45309;
    --danger: #DC2626;
    --danger-soft: rgba(220, 38, 38, .08);
    --shadow: 0 1px 2px rgba(90, 60, 30, .06);
    --shadow-lift: 0 2px 4px rgba(90, 60, 30, .06), 0 8px 20px -8px rgba(90, 60, 30, .18);
    --ease: cubic-bezier(.2, .8, .2, 1);
    --serif: var(--sans);
    --sans: "Nunito", ui-rounded, ui-sans-serif, system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1611;
      --glow-1: transparent;
      --glow-2: transparent;
      --glow-3: transparent;
      --surface: #241F18;
      --surface-solid: #241F18;
      --surface-hover: #2B251D;
      --ink: #F6EEE2;
      --ink-2: #CFC2B1;
      --muted: #A09282;
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .16);
      --accent: hsl(var(--h) 90% 68%);
      --accent-2: hsl(calc(var(--h) - 28) 85% 62%);
      --accent-ink: #0B1220;
      --accent-soft: hsl(var(--h) 90% 68% / .15);
      --ok: #4ADE80;
      --warn: #FBBF24;
      --danger: #F87171;
      --danger-soft: rgba(248, 113, 113, .12);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-lift: 0 1px 3px rgba(0, 0, 0, .4), 0 4px 12px -4px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1611;
    --glow-1: transparent;
    --glow-2: transparent;
    --glow-3: transparent;
    --surface: #241F18;
    --surface-solid: #241F18;
    --surface-hover: #2B251D;
    --ink: #F6EEE2;
    --ink-2: #CFC2B1;
    --muted: #A09282;
    --line: rgba(255, 255, 255, .08);
    --line-strong: rgba(255, 255, 255, .16);
    --accent: hsl(var(--h) 90% 68%);
    --accent-2: hsl(calc(var(--h) - 28) 85% 62%);
    --accent-ink: #0B1220;
    --accent-soft: hsl(var(--h) 90% 68% / .15);
    --ok: #4ADE80;
    --warn: #FBBF24;
    --danger: #F87171;
    --danger-soft: rgba(248, 113, 113, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lift: 0 1px 3px rgba(0, 0, 0, .4), 0 4px 12px -4px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background .4s var(--ease), color .4s var(--ease);
  }

  .shell {
    position: relative; z-index: 1;
    max-width: 640px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px 96px;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 14px; height: 14px; }
  .top-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    color: var(--ink-2); transition: background .2s, color .2s;
  }
  .icon-btn:hover { background: var(--surface); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }
  .who {
    font-size: 13px; color: var(--muted); max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- Hero ---------- */
  .hero {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px;
    padding: 26px 26px 24px; border-radius: 24px; color: #fff;
    background: linear-gradient(120deg, hsl(var(--h) 80% 52%), hsl(calc(var(--h) - 28) 78% 52%), hsl(calc(var(--h) - 12) 80% 55%));
    background-size: 220% 220%; animation: sweep 14s ease-in-out infinite alternate;
    box-shadow: 0 14px 34px -16px hsl(var(--h) 80% 45% / .7);
    transition: box-shadow .4s var(--ease);
  }
  @keyframes sweep { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
  .hero .eyebrow { color: rgba(255, 255, 255, .82); }
  .hero .subtitle { color: rgba(255, 255, 255, .9); }
  .hero .ring .track { stroke: rgba(255, 255, 255, .28); }
  .hero .ring .fill, .hero .ring.complete .fill { stroke: #fff; }
  .hero .ring-label small { color: rgba(255, 255, 255, .8); }
  .eyebrow {
    font-size: 13px; font-weight: 500;
    color: var(--muted); margin-bottom: 6px;
  }
  h1 {
    font-weight: 800; font-size: clamp(32px, 6.5vw, 42px);
    line-height: 1.1; letter-spacing: -.02em; margin: 0;
  }
  h1 em { font-style: normal; }
  .subtitle { margin: 12px 0 0; color: var(--ink-2); font-size: 15px; }

  .ring { position: relative; width: 76px; height: 76px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--line-strong); }
  .ring .fill {
    stroke: var(--accent); stroke-linecap: round;
    transition: stroke-dashoffset .8s var(--ease), stroke .4s;
  }
  .ring.complete .fill { stroke: var(--ok); }
  .ring-label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 18px; font-weight: 600; line-height: 1;
  }
  .ring-label small { display: block; font-family: var(--sans); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; text-align: center; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  /* ---------- Lists ---------- */
  .lists {
    display: flex; gap: 6px; align-items: center; overflow-x: auto;
    margin: 0 -16px 14px; padding: 2px 16px 4px; scrollbar-width: none;
  }
  .lists::-webkit-scrollbar { display: none; }
  .list-tab {
    flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px;
    border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line); transition: background .2s, color .2s;
  }
  .list-tab:hover { color: var(--ink); background: var(--surface-hover); }
  .list-tab[aria-current="true"] {
    background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent;
    box-shadow: 0 6px 16px -8px var(--accent);
  }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--tab-h) 75% 55%); }
  .list-tab[aria-current="true"] .dot { background: #fff; }
  .list-tab { transition: background .2s, color .2s, transform .2s var(--ease); }
  .list-tab:active { transform: scale(.96); }
  .list-tab .count { font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; }
  .list-add { color: var(--muted); background: transparent; border-style: dashed; border-color: var(--line-strong); }
  .list-add svg { width: 14px; height: 14px; }
  .list-more {
    flex: none; width: 30px; height: 34px; margin-left: -4px; border-radius: 10px;
    display: grid; place-items: center; color: var(--muted); transition: background .2s, color .2s;
  }
  .list-more:hover { color: var(--ink); background: var(--surface); }
  .list-more svg { width: 16px; height: 16px; }
  .list-input {
    flex: none; width: 150px; height: 34px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px;
    font-weight: 600; color: var(--ink); background: var(--surface-solid); border: 1.5px solid var(--accent); outline: 0;
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .confirm-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: -4px 0 14px; padding: 12px 14px;
    border-radius: 14px; background: var(--danger-soft); color: var(--ink); font-size: 14px; font-weight: 600;
  }
  .confirm-bar span { flex: 1 1 200px; }
  .confirm-bar .danger-solid { background: var(--danger); color: #fff; padding: 7px 14px; border-radius: 10px; font-weight: 700; }
  .confirm-bar .text-btn:hover { color: var(--ink); background: var(--line); }
  .behind { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; color: var(--ink-2); padding: 2px 2px 4px; }
  .behind b { color: var(--ink); }
  .replan-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
  .replan-btn svg { width: 14px; height: 14px; }
  .menu {
    position: fixed; z-index: 20; min-width: 170px; padding: 6px; border-radius: 14px;
    background: var(--surface-solid); display: flex; flex-direction: column; box-shadow: var(--shadow-lift);
  }
  .menu button { text-align: left; padding: 9px 12px; border-radius: 9px; font-size: 14px; }
  .menu button:hover { background: var(--line); }
  .menu .danger { color: var(--danger); }
  .menu .danger:hover { background: var(--danger-soft); }

  /* ---------- Composer ---------- */
  .composer { padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 8px; transition: box-shadow .3s var(--ease), border-color .3s; }
  .composer:focus-within { box-shadow: var(--shadow-lift), 0 0 0 4px var(--accent-soft); border-color: transparent; }
  .composer .plus { color: var(--muted); flex: none; display: grid; }
  .composer .plus svg { width: 20px; height: 20px; }
  .composer input[type="text"] {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-size: 17px; padding: 12px 4px;
  }
  .composer input::placeholder { color: var(--muted); }
  .pill {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 12px; border-radius: 12px; font-size: 13px; font-weight: 500;
    color: var(--ink-2); white-space: nowrap; transition: background .2s, color .2s;
  }
  .pill:hover { background: var(--accent-soft); color: var(--ink); }
  .pill svg { width: 16px; height: 16px; }
  .pill.set { background: var(--accent-soft); color: var(--accent); }
  .pill input[type="date"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; border: 0;
  }
  .add-btn {
    height: 42px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
    font-weight: 600; font-size: 14px; flex: none;
    transition: transform .2s var(--ease), opacity .2s, box-shadow .2s;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:active { transform: translateY(0) scale(.97); }
  .add-btn:disabled { opacity: .45; transform: none; box-shadow: none; cursor: default; }
  .clear-due { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); margin-left: -6px; }
  .clear-due:hover { background: var(--accent-soft); }
  .clear-due svg { width: 12px; height: 12px; }

  /* ---------- Filters ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 14px; }
  .segmented {
    position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  }
  .segmented .indicator {
    position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3);
    border-radius: 10px; background: var(--surface-solid); box-shadow: var(--shadow);
    transition: transform .35s var(--ease);
  }
  .segmented button {
    position: relative; z-index: 1; padding: 7px 14px; font-size: 13px; font-weight: 500; color: var(--muted);
    transition: color .2s; display: flex; gap: 6px; align-items: center; justify-content: center;
  }
  .segmented button[aria-pressed="true"] { color: var(--ink); }
  .segmented .count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .text-btn { font-size: 13px; color: var(--muted); padding: 6px 8px; border-radius: 8px; transition: color .2s, background .2s; }
  .text-btn:hover { color: var(--danger); background: var(--danger-soft); }

  /* ---------- List ---------- */
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
    padding: 16px 14px 16px 16px; cursor: pointer;
    transition: background .2s, box-shadow .3s var(--ease), transform .2s var(--ease);
  }
  .item:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .item.open { border-color: var(--accent); box-shadow: var(--shadow-lift), 0 0 0 3px var(--accent-soft); cursor: default; transform: none; }
  .item.leaving { animation: leave .28s var(--ease) forwards; pointer-events: none; }
  @keyframes leave { to { opacity: 0; transform: translateX(24px) scale(.98); } }

  .check {
    width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; flex: none;
    border: 1.75px solid var(--line-strong); display: grid; place-items: center;
    transition: background .25s var(--ease), border-color .25s, transform .2s var(--ease);
  }
  .check:hover { border-color: var(--accent); transform: scale(1.08); }
  .check svg { width: 14px; height: 14px; }
  .check path {
    fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .08s var(--ease);
  }
  .done .check { background: var(--ok); border-color: var(--ok); animation: pop .35s var(--ease); }
  .done .check path { stroke-dashoffset: 0; stroke: #fff; }
  @keyframes pop { 50% { transform: scale(1.18); } }

  .body { min-width: 0; }
  .title {
    font-size: 16px; line-height: 1.4; word-wrap: break-word; position: relative; display: inline;
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0% 1.5px; background-repeat: no-repeat; background-position: 0 58%;
    transition: background-size .35s var(--ease), color .3s;
  }
  .done .title { color: var(--muted); background-size: 100% 1.5px; }
  .title-input {
    width: 100%; font-size: 16px; line-height: 1.4; border: 0; outline: 0; padding: 0;
    background: transparent; border-bottom: 1.5px solid var(--accent);
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .meta:empty { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500;
    padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--ink-2);
  }
  .chip svg { width: 12px; height: 12px; }
  .chip.today { background: var(--accent-soft); color: var(--accent); }
  .chip.overdue { background: var(--danger-soft); color: var(--danger); }
  .done .chip { background: var(--line); color: var(--muted); }

  .expand { color: var(--muted); width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; transition: transform .3s var(--ease), background .2s, color .2s; }
  .expand:hover { background: var(--line); color: var(--ink); }
  .expand svg { width: 16px; height: 16px; }
  .open .expand { transform: rotate(180deg); }
  .open .title { cursor: text; }

  .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
  .open .panel { grid-template-rows: 1fr; }
  .panel > div { overflow: hidden; }
  .panel-inner { padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .notes {
    width: 100%; min-height: 76px; resize: vertical; border-radius: 14px; padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--line); outline: 0; font-size: 14px; line-height: 1.55;
    transition: border-color .2s, box-shadow .2s;
  }
  .notes:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .notes::placeholder { color: var(--muted); }
  .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .field { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .field input[type="date"] {
    border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 13px; outline: 0;
  }
  .field input[type="date"]:focus { border-color: var(--accent); }
  .danger-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--danger);
    padding: 7px 12px; border-radius: 10px; transition: background .2s;
  }
  .danger-btn:hover { background: var(--danger-soft); }
  .danger-btn svg { width: 15px; height: 15px; }
  .hint { font-size: 12px; color: var(--muted); }

  /* ---------- Steps ---------- */
  .steps { display: flex; flex-direction: column; gap: 4px; }
  .step-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .step { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 2px 4px 2px 2px; border-radius: 10px; }
  .step:hover { background: var(--line); }
  .step-check {
    width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--line-strong);
    display: grid; place-items: center; transition: background .2s, border-color .2s;
  }
  .step-check:hover { border-color: var(--accent); }
  .step-check svg { width: 11px; height: 11px; }
  .step-check path { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .step.done .step-check { background: var(--ok); border-color: var(--ok); }
  .step.done .step-check path { opacity: 1; }
  .step-title {
    min-width: 0; border: 0; outline: 0; background: transparent; padding: 5px 0; font-size: 14px;
    border-bottom: 1.5px solid transparent;
  }
  .step-title:focus { border-bottom-color: var(--accent); }
  .step.done .step-title { color: var(--muted); text-decoration: line-through; }
  .step-del {
    width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: var(--muted);
    opacity: 0; transition: opacity .2s, background .2s, color .2s;
  }
  .step:hover .step-del, .step-del:focus-visible { opacity: 1; }
  @media (hover: none) { .step-del { opacity: .6; } }
  .step-del:hover { color: var(--danger); background: var(--danger-soft); }
  .step-del svg { width: 12px; height: 12px; }
  .step-add {
    border: 0; outline: 0; background: transparent; font-size: 14px; padding: 8px 2px 6px;
    border-bottom: 1px dashed var(--line-strong);
  }
  .step-add:focus { border-bottom: 1px solid var(--accent); }
  .step-add::placeholder { color: var(--muted); }
  .breakdown-btn {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
    border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600;
    transition: transform .2s var(--ease);
  }
  .breakdown-btn:hover { transform: translateY(-1px); }
  .breakdown-btn svg { width: 16px; height: 16px; }
  .list-tab.next-tab svg { width: 15px; height: 15px; }
  .next-item .goal-chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next-item .expand svg { transform: rotate(-90deg); }
  .finish {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 14px;
  }
  .finish b { font-weight: 800; }
  .finish svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 6px; color: var(--accent); }
  .finish .bar { width: 70px; height: 6px; }
  .step { grid-template-columns: auto 1fr auto auto; }
  .step-date { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .step-date.today { color: var(--accent); }
  .step-date.overdue { color: var(--danger); }
  .step.done .step-date { opacity: .5; }
  .ask-due { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .ask-due input[type="date"] { border: 1px solid var(--line-strong); background: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 14px; outline: 0; }
  .ask-due input[type="date"]:focus { border-color: var(--accent); }
  .ask-due .text-btn:hover { color: var(--ink); background: var(--line); }
  .step.enter { animation: stepIn .4s var(--ease) both; }
  @keyframes stepIn { from { opacity: 0; transform: translateX(-10px); } }
  .bar { width: 34px; height: 4px; border-radius: 4px; background: var(--line-strong); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .5s var(--ease); }
  .chip.steps-done .bar i { background: var(--ok); }
  .chip.steps-done { background: rgba(47, 138, 98, .14); color: var(--ok); }

  /* ---------- Section label ---------- */
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    margin: 22px 4px 4px; list-style: none;
  }

  /* ---------- Empty + loading ---------- */
  .empty { text-align: center; padding: 56px 20px 40px; }
  .empty svg { width: 120px; height: 120px; margin-bottom: 10px; }
  .empty h2 { font-weight: 800; font-size: 22px; margin: 0 0 6px; }
  .empty p { margin: 0; color: var(--ink-2); }
  .skeleton { height: 58px; border-radius: 18px; background: linear-gradient(90deg, var(--line) 0%, var(--line-strong) 50%, var(--line) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; opacity: .6; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .footer-note { text-align: center; margin-top: 40px; font-size: 12px; color: var(--muted); }
  kbd { font-family: var(--sans); font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); }

  /* ---------- Auth ---------- */
  .auth { min-height: calc(100vh - 140px); display: grid; place-items: center; }
  .auth-card { width: 100%; max-width: 420px; padding: 32px 28px 26px; border-radius: 16px; }
  .auth h1 { font-size: 34px; font-weight: 800; margin-bottom: 10px; }
  .auth .lede { color: var(--ink-2); margin: 0 0 28px; }
  .auth label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .auth input {
    width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface-solid);
    padding: 0 16px; font-size: 15px; outline: 0; margin-bottom: 16px; transition: border-color .2s, box-shadow .2s;
  }
  .auth input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .auth .add-btn { width: 100%; height: 50px; font-size: 15px; margin-top: 6px; }
  .auth .switch { text-align: center; margin-top: 18px; font-size: 14px; color: var(--ink-2); }
  .auth .switch button { color: var(--accent); font-weight: 600; }
  .notice { font-size: 14px; padding: 12px 14px; border-radius: 14px; margin-bottom: 16px; }
  .notice.error { background: var(--danger-soft); color: var(--danger); }
  .notice.info { background: var(--accent-soft); color: var(--ink); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 10;
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 18px; border-radius: 16px;
    background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--shadow-lift);
    transition: transform .35s var(--ease), opacity .35s var(--ease); max-width: calc(100vw - 32px);
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .toast button { color: var(--accent); font-weight: 600; padding: 4px 8px; border-radius: 8px; }
  .toast button:hover { background: rgba(255, 255, 255, .1); }

  @media (max-width: 520px) {
    .topbar { margin-bottom: 28px; }
    .who { display: none; }
    .ring { width: 64px; height: 64px; }
    .composer { flex-wrap: wrap; padding: 8px 8px 8px 16px; }
    .composer input[type="text"] { flex-basis: calc(100% - 40px); }
    .composer .spacer { flex: 1; }
    .toolbar { flex-wrap: wrap; }
    .segmented button { padding: 7px 10px; }
    .auth-card { padding: 28px 22px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Today
    </div>
    <div class="top-actions">
      <span class="who" id="who" hidden></span>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="signOutBtn" aria-label="Sign out" title="Sign out" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ Auth ============ -->
  <main class="auth" id="authView" hidden>
    <form class="card auth-card" id="authForm" novalidate>
      <div class="eyebrow" id="authEyebrow">Welcome back</div>
      <h1 id="authTitle">A calmer <em>list.</em></h1>
      <p class="lede" id="authLede">Sign in to pick up where you left off.</p>
      <div class="notice" id="authNotice" hidden></div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required>
      <button class="add-btn" id="authSubmit" type="submit">Sign in</button>
      <div class="switch"><span id="switchText">New here?</span> <button type="button" id="switchMode">Create an account</button></div>
    </form>
  </main>

  <!-- ============ App ============ -->
  <main id="appView" hidden>
    <section class="hero">
      <div>
        <div class="eyebrow" id="dateLine"></div>
        <h1 id="greeting"></h1>
        <p class="subtitle" id="subtitle">&nbsp;</p>
      </div>
      <div class="ring" id="ring" aria-hidden="true">
        <svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="34"/><circle class="fill" id="ringFill" cx="40" cy="40" r="34"/></svg>
        <div class="ring-label"><div><span id="ringPct">0</span><small>done</small></div></div>
      </div>
    </section>

    <nav class="lists" id="lists" aria-label="Your lists"></nav>
    <div class="confirm-bar" id="listConfirm" role="alertdialog" hidden></div>

    <form class="card composer" id="composer" autocomplete="off">
      <span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <input type="text" id="newTitle" placeholder="What needs doing?" maxlength="500" aria-label="New to-do">
      <span class="spacer"></span>
      <label class="pill" id="duePill" title="Set a due date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        <span id="dueLabel">Due</span>
        <input type="date" id="newDue" aria-label="Due date">
      </label>
      <button type="button" class="clear-due" id="clearDue" aria-label="Clear due date" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="add-btn" type="submit" id="addBtn" disabled>Add</button>
    </form>

    <div class="toolbar">
      <div class="segmented" id="filters" role="group" aria-label="Filter" hidden>
        <span class="indicator" id="indicator"></span>
        <button type="button" data-filter="all" aria-pressed="true">All <span class="count" data-count="all"></span></button>
        <button type="button" data-filter="active" aria-pressed="false">Open <span class="count" data-count="active"></span></button>
        <button type="button" data-filter="done" aria-pressed="false">Done <span class="count" data-count="done"></span></button>
      </div>
      <button class="text-btn" id="clearDone" hidden>Clear completed</button>
    </div>

    <ul class="list" id="list" aria-live="polite"></ul>
    <div id="empty" hidden></div>

  </main>
</div>

<div class="card menu" id="listMenu" role="menu" hidden>
  <button type="button" role="menuitem" data-act="rename">Rename list</button>
  <button type="button" role="menuitem" data-act="delete" class="danger">Delete list</button>
</div>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastAction" hidden>Undo</button></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";
import { breakDown } from "./breakdown.js";

const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = {
  user: null,
  lists: [],
  listId: null,
  todos: [],
  loading: true,
  filter: "all",
  openId: null,
  editingId: null,
  fresh: new Set(),
  freshSteps: new Set(),
  askDueFor: null, // to-do whose "Break it down" is asking for a finish date
  replanFor: null, // goal whose re-plan is asking for a new finish date
  listEdit: null, // { id } while renaming a list, { id: null } while naming a new one
  confirmDeleteId: null, // list waiting on "Delete?" confirmation
};

// Each list gets its own color, by its place in the row.
// School blue, Goals coral, Chores green, then amber, rose, teal, gold. No purple (friend test).
const HUES = [214, 8, 152, 32, 345, 186, 48];
const NEXT = "next"; // the "Next steps" view, not a real list
const NEXT_HUE = 24;
const hueOf = (list) => HUES[Math.max(0, state.lists.indexOf(list)) % HUES.length];
function applyListColor() {
  const list = state.lists.find((l) => l.id === state.listId);
  document.documentElement.style.setProperty("--h", state.listId === NEXT ? NEXT_HUE : list ? hueOf(list) : HUES[0]);
}

/* ---------------- Icons ---------------- */
const ICONS = {
  check: '<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>',
  replan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  steps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
};

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v; // only ever used with the static ICONS above
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

/* ---------------- Theme ---------------- */
function storedTheme() { try { return localStorage.getItem("theme"); } catch { return null; } }
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
applyTheme(storedTheme());
$("themeBtn").addEventListener("click", () => {
  const isDark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = isDark ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("theme", next); } catch {}
});

/* ---------------- Toast ---------------- */
let toastTimer;
function toast(text, action) {
  $("toastText").textContent = text;
  const btn = $("toastAction");
  btn.hidden = !action;
  btn.onclick = action ? () => { hideToast(); action.run(); } : null;
  if (action) btn.textContent = action.label;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 5000 : 3200);
}
function hideToast() { $("toast").classList.remove("show"); }

/* ---------------- Auth ---------------- */
let authMode = "signin";
function setAuthMode(mode) {
  authMode = mode;
  const up = mode === "signup";
  $("authEyebrow").textContent = up ? "Get started" : "Welcome back";
  $("authTitle").innerHTML = up ? "Begin with <em>one thing.</em>" : "A calmer <em>list.</em>";
  $("authLede").textContent = up ? "Create an account. Your to-dos are private to you." : "Sign in to pick up where you left off.";
  $("authSubmit").textContent = up ? "Create account" : "Sign in";
  $("switchText").textContent = up ? "Already have an account?" : "New here?";
  $("switchMode").textContent = up ? "Sign in" : "Create an account";
  $("password").autocomplete = up ? "new-password" : "current-password";
  $("authNotice").hidden = true;
}
function authNotice(text, kind) {
  const n = $("authNotice");
  n.textContent = text;
  n.className = `notice ${kind}`;
  n.hidden = false;
}
$("switchMode").addEventListener("click", () => setAuthMode(authMode === "signin" ? "signup" : "signin"));

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || password.length < 6) return authNotice("Enter your email and a password of at least 6 characters.", "error");
  const btn = $("authSubmit");
  btn.disabled = true;
  try {
    if (authMode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) authNotice(error.message, "error");
    } else {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { emailRedirectTo: location.origin + location.pathname },
      });
      if (error) authNotice(error.message, "error");
      else if (!data.session) authNotice("Almost there — check your inbox for a confirmation link, then come back and sign in.", "info");
    }
  } finally {
    btn.disabled = false;
  }
});

$("signOutBtn").addEventListener("click", () => sb.auth.signOut());

let shownUserId; // undefined until the first auth event
function setUser(user) {
  const id = user?.id ?? null;
  if (id === shownUserId) return;
  shownUserId = id;
  state.user = user;
  $("authView").hidden = !!user;
  $("appView").hidden = !user;
  $("signOutBtn").hidden = !user;
  $("who").hidden = !user;
  if (user) {
    $("who").textContent = user.email;
    state.todos = [];
    state.lists = [];
    state.listId = null;
    state.loading = true;
    renderHero();
    render();
    loadTodos();
  } else {
    setAuthMode("signin");
    $("password").value = "";
  }
}

// Supabase warns against awaiting other client calls inside this callback, so defer.
sb.auth.onAuthStateChange((_event, session) => setTimeout(() => setUser(session?.user ?? null), 0));

/* ---------------- Data ---------------- */
const DEFAULT_LISTS = ["School", "Goals", "Chores"];
const byPosition = (a, b) => a.position - b.position || a.created_at.localeCompare(b.created_at);

async function loadTodos() {
  const [lists, todos] = await Promise.all([sb.from("lists").select("*"), sb.from("todos").select("*")]);
  const error = lists.error || todos.error;
  if (error) { state.loading = false; toast("Couldn't load your to-dos. " + error.message); render(); return; }
  state.lists = lists.data.sort(byPosition);
  state.todos = todos.data;
  if (!state.lists.length) await makeDefaultLists();
  // To-dos made before lists existed go in the first list.
  const first = state.lists[0]?.id;
  if (first && state.todos.some((t) => !t.list_id)) {
    const { error } = await sb.from("todos").update({ list_id: first }).is("list_id", null);
    if (!error) state.todos.forEach((t) => { t.list_id ??= first; });
  }
  state.loading = false;
  const saved = storedListId();
  state.listId = saved === NEXT || state.lists.some((l) => l.id === saved) ? saved
    : nextSteps().length ? NEXT : first ?? null;
  renderLists();
  render();
}

async function makeDefaultLists() {
  const rows = DEFAULT_LISTS.map((name, position) => ({ id: crypto.randomUUID(), name, position }));
  const { data, error } = await sb.from("lists").insert(rows).select();
  if (error) return toast("Couldn't set up your lists. " + error.message);
  state.lists = data.sort(byPosition);
}

async function addTodo(title, due_date) {
  if (!state.listId) return toast("Make a list first.");
  const now = new Date().toISOString();
  const todo = {
    id: crypto.randomUUID(), title, notes: null, is_complete: false, list_id: state.listId,
    parent_id: null, position: 0, due_date: due_date || null, created_at: now, updated_at: now,
  };
  state.todos.push(todo);
  state.fresh.add(todo.id);
  if (state.filter === "done") setFilter("all");
  render();
  const { error } = await sb.from("todos").insert({ id: todo.id, title, list_id: todo.list_id, due_date: todo.due_date });
  if (error) {
    state.todos = state.todos.filter((t) => t.id !== todo.id);
    render();
    toast("Couldn't save that. " + error.message);
  }
}

async function patchTodo(id, fields, { rerender = true } = {}) {
  const todo = state.todos.find((t) => t.id === id);
  if (!todo) return;
  const prev = { ...todo };
  Object.assign(todo, fields, { updated_at: new Date().toISOString() });
  if (rerender) render();
  const { error } = await sb.from("todos").update(fields).eq("id", id);
  if (error) {
    Object.assign(todo, prev);
    render();
    toast("Couldn't update that. " + error.message);
  }
}

// Adds steps under a to-do, after any it already has.
async function addSteps(parent, titles, { focusAdd = false, dates = [] } = {}) {
  const now = new Date().toISOString();
  const start = stepsOf(parent.id).reduce((n, s) => Math.max(n, s.position + 1), 0);
  const rows = titles.map((title, i) => ({
    id: crypto.randomUUID(), title, list_id: parent.list_id, parent_id: parent.id, position: start + i,
    due_date: dates[i] ?? null,
  }));
  state.todos.push(...rows.map((r) => ({ ...r, notes: null, is_complete: false, created_at: now, updated_at: now })));
  rows.forEach((r) => state.freshSteps.add(r.id));
  render();
  state.freshSteps.clear();
  if (focusAdd) $("list").querySelector(`[data-id="${parent.id}"] .step-add`)?.focus();
  const { error } = await sb.from("todos").insert(rows);
  if (error) {
    const added = rows.map((r) => r.id);
    state.todos = state.todos.filter((t) => !added.includes(t.id));
    render();
    toast("Couldn't save that. " + error.message);
  }
}

async function deleteTodos(ids, message) {
  // A to-do's steps go with it (the database cascades), so keep them for Undo too.
  // Parents come first so Undo can insert them before their steps.
  const removed = state.todos
    .filter((t) => ids.includes(t.id) || ids.includes(t.parent_id))
    .sort((a, b) => !!a.parent_id - !!b.parent_id);
  if (!removed.length) return;
  ids = removed.map((t) => t.id);
  const nodes = [...$("list").querySelectorAll(".item")].filter((n) => ids.includes(n.dataset.id));
  nodes.forEach((n) => n.classList.add("leaving"));
  await new Promise((r) => setTimeout(r, reduceMotion ? 0 : 260));
  state.todos = state.todos.filter((t) => !ids.includes(t.id));
  if (ids.includes(state.openId)) state.openId = null;
  render();
  const { error } = await sb.from("todos").delete().in("id", ids);
  if (error) {
    state.todos.push(...removed);
    render();
    return toast("Couldn't delete. " + error.message);
  }
  toast(message, {
    label: "Undo",
    run: async () => {
      state.todos.push(...removed);
      render();
      const { error } = await sb.from("todos").insert(removed.map(({ user_id, ...row }) => row));
      if (error) {
        state.todos = state.todos.filter((t) => !ids.includes(t.id));
        render();
        toast("Couldn't restore. " + error.message);
      }
    },
  });
}

/* ---------------- Dates ---------------- */
const DAY = 86400000;
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function dueInfo(s) {
  if (!s) return null;
  const date = parseDate(s);
  const diff = Math.round((date - startOfToday()) / DAY);
  if (diff < -1) return { label: `${-diff} days overdue`, cls: "overdue" };
  if (diff === -1) return { label: "Yesterday", cls: "overdue" };
  if (diff === 0) return { label: "Today", cls: "today" };
  if (diff === 1) return { label: "Tomorrow", cls: "" };
  if (diff < 7) return { label: date.toLocaleDateString(undefined, { weekday: "long" }), cls: "" };
  return {
    label: date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: date.getFullYear() === new Date().getFullYear() ? undefined : "numeric" }),
    cls: "",
  };
}

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
// Spreads n steps evenly from today to the due date; the last step lands on the due date.
function planDates(n, due) {
  if (!due) return [];
  const today = startOfToday();
  const days = Math.max(0, Math.round((parseDate(due) - today) / DAY));
  return Array.from({ length: n }, (_, i) =>
    isoDate(new Date(today.getFullYear(), today.getMonth(), today.getDate() + Math.round(((i + 1) * days) / n))));
}

/* ---------------- Hero ---------------- */
function renderHero() {
  const now = new Date();
  const h = now.getHours();
  const greet = h < 5 ? ["Still", "up?"] : h < 12 ? ["Good", "morning."] : h < 18 ? ["Good", "afternoon."] : ["Good", "evening."];
  $("dateLine").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  $("greeting").replaceChildren(greet[0] + " ", el("em", {}, greet[1]));
}

function renderProgress() {
  if (state.listId === NEXT) return renderNextProgress();
  const items = state.todos.filter(inList);
  const total = items.length;
  const done = items.filter((t) => t.is_complete).length;
  const open = total - done;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const C = 2 * Math.PI * 34;
  const fill = $("ringFill");
  fill.style.strokeDasharray = C;
  fill.style.strokeDashoffset = C * (1 - pct / 100);
  $("ringPct").textContent = pct + "%";
  $("ring").classList.toggle("complete", total > 0 && open === 0);

  const overdue = items.filter((t) => !t.is_complete && dueInfo(t.due_date)?.cls === "overdue").length;
  const today = items.filter((t) => !t.is_complete && t.due_date && dueInfo(t.due_date).cls === "today").length;
  let sub;
  if (state.loading) sub = "Gathering your list…";
  else if (!total) sub = "A blank page. What matters today?";
  else if (!open) sub = "Everything’s done. Enjoy the quiet.";
  else {
    sub = `${open} ${open === 1 ? "thing" : "things"} left`;
    if (today) sub += ` · ${today} due today`;
    if (overdue) sub += ` · ${overdue} overdue`;
  }
  $("subtitle").textContent = sub;

  $("filters").querySelector('[data-count="all"]').textContent = total || "";
  $("filters").querySelector('[data-count="active"]').textContent = open || "";
  $("filters").querySelector('[data-count="done"]').textContent = done || "";
  $("clearDone").hidden = !done;
  renderLists();
}

function renderNextProgress() {
  const goals = state.todos.filter((t) => !t.parent_id && !t.is_complete && stepsOf(t.id).length);
  const steps = goals.flatMap((g) => stepsOf(g.id));
  const done = steps.filter((s) => s.is_complete).length;
  const pct = steps.length ? Math.round((done / steps.length) * 100) : 0;
  const C = 2 * Math.PI * 34;
  $("ringFill").style.strokeDasharray = C;
  $("ringFill").style.strokeDashoffset = C * (1 - pct / 100);
  $("ringPct").textContent = pct + "%";
  $("ring").classList.toggle("complete", false);
  const n = nextSteps().length;
  $("subtitle").textContent = state.loading ? "Gathering your list…"
    : n ? `${n} next ${n === 1 ? "step" : "steps"}, one for each goal` : "No next steps yet";
  $("clearDone").hidden = true;
  renderLists();
}

// The first unfinished step of each unfinished goal, soonest first.
function nextSteps() {
  return state.todos
    .filter((t) => !t.parent_id && !t.is_complete)
    .map((goal) => ({ goal, step: stepsOf(goal.id).find((s) => !s.is_complete) }))
    .filter((x) => x.step)
    .sort((a, b) => (a.step.due_date ?? a.goal.due_date ?? "9999").localeCompare(b.step.due_date ?? b.goal.due_date ?? "9999"));
}

/* ---------------- Lists ---------------- */
function storedListId() { try { return localStorage.getItem("listId"); } catch { return null; } }
function currentList() { return state.lists.find((l) => l.id === state.listId); }
// Top-level to-dos in the open list (steps live under their parent).
function inList(t) { return t.list_id === state.listId && !t.parent_id; }
function stepsOf(id) { return state.todos.filter((t) => t.parent_id === id).sort(byPosition); }

function selectList(id) {
  state.listId = id;
  state.confirmDeleteId = null;
  state.openId = null;
  state.editingId = null;
  try { localStorage.setItem("listId", id); } catch {}
  renderLists();
  render();
}

function listNameInput(value) {
  const input = el("input", { class: "list-input", value, maxlength: 60, placeholder: "List name", "aria-label": "List name" });
  let finished = false;
  const finish = (save) => {
    if (finished) return;
    finished = true;
    const id = state.listEdit?.id;
    state.listEdit = null;
    const name = input.value.trim().slice(0, 60);
    if (save && name) id ? renameList(id, name) : createList(name);
    else renderLists();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") finish(true);
    if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
  requestAnimationFrame(() => { input.focus(); input.select(); });
  return input;
}

function renderLists() {
  if (state.loading) return $("lists").replaceChildren();
  // Don't rebuild the row out from under someone typing a list name.
  if (state.listEdit && document.activeElement?.classList.contains("list-input")) return;
  renderListConfirm();
  const tabs = [];
  const nextCount = nextSteps().length;
  const nextTab = el("button", {
    type: "button", class: "list-tab next-tab", html: ICONS.spark, style: `--tab-h: ${NEXT_HUE}`,
    "aria-current": String(state.listId === NEXT), onclick: () => { if (state.listId !== NEXT) selectList(NEXT); },
  });
  nextTab.append("Next steps");
  if (nextCount) nextTab.append(el("span", { class: "count" }, String(nextCount)));
  tabs.push(nextTab);
  for (const l of state.lists) {
    if (state.listEdit?.id === l.id) { tabs.push(listNameInput(l.name)); continue; }
    const active = l.id === state.listId;
    const open = state.todos.filter((t) => t.list_id === l.id && !t.parent_id && !t.is_complete).length;
    tabs.push(el("button", {
      type: "button", class: "list-tab", "aria-current": String(active), style: `--tab-h: ${hueOf(l)}`,
      title: active ? "Rename or delete this list" : null, "aria-haspopup": active ? "menu" : null,
      // Clicking the open list's tab opens its menu, same as the ⋯ button.
      onclick: (e) => {
        if (!active) return selectList(l.id);
        e.stopPropagation();
        toggleListMenu(e.currentTarget);
      },
    }, el("span", { class: "dot" }), l.name, open ? el("span", { class: "count" }, String(open)) : null));
    if (active) {
      tabs.push(el("button", {
        type: "button", class: "list-more", html: ICONS.more, "aria-label": `Options for ${l.name}`, "aria-haspopup": "menu",
        onclick: (e) => { e.stopPropagation(); toggleListMenu(e.currentTarget); },
      }));
    }
  }
  if (state.listEdit && !state.listEdit.id) tabs.push(listNameInput(""));
  else {
    const add = el("button", {
      type: "button", class: "list-tab list-add", html: ICONS.plus,
      onclick: () => { state.listEdit = { id: null }; renderLists(); },
    });
    add.append("New list");
    tabs.push(add);
  }
  $("lists").replaceChildren(...tabs);
  applyListColor();
}

function toggleListMenu(anchor) {
  const menu = $("listMenu");
  if (!menu.hidden) return closeListMenu();
  menu.hidden = false;
  const r = anchor.getBoundingClientRect();
  menu.style.top = `${r.bottom + 6}px`;
  menu.style.left = `${Math.max(12, Math.min(r.left, innerWidth - menu.offsetWidth - 12))}px`;
}
function closeListMenu() { $("listMenu").hidden = true; }
$("listMenu").addEventListener("click", (e) => {
  const act = e.target.closest("button")?.dataset.act;
  closeListMenu();
  const list = currentList();
  if (!list) return;
  if (act === "rename") { state.listEdit = { id: list.id }; renderLists(); }
  if (act === "delete") {
    if (state.lists.length === 1) return toast("You need at least one list.");
    state.confirmDeleteId = list.id;
    renderListConfirm();
  }
});
document.addEventListener("click", (e) => { if (!e.target.closest("#listMenu")) closeListMenu(); });
addEventListener("scroll", closeListMenu, { passive: true });
$("lists").addEventListener("scroll", closeListMenu, { passive: true });

function renderListConfirm() {
  const bar = $("listConfirm");
  const list = state.lists.find((l) => l.id === state.confirmDeleteId);
  bar.hidden = !list || state.listId !== list.id;
  if (bar.hidden) return;
  const count = state.todos.filter((t) => t.list_id === list.id && !t.parent_id).length;
  const things = count === 1 ? "1 to-do" : `${count} to-dos`;
  bar.replaceChildren(
    el("span", {}, count ? `Delete “${list.name}” and its ${things}?` : `Delete “${list.name}”?`),
    el("button", { type: "button", class: "danger-solid", onclick: () => deleteList(list.id) }, "Delete"),
    el("button", { type: "button", class: "text-btn", onclick: () => { state.confirmDeleteId = null; renderListConfirm(); } }, "Cancel"),
  );
}

async function createList(name) {
  const list = {
    id: crypto.randomUUID(), name, created_at: new Date().toISOString(),
    position: state.lists.reduce((n, l) => Math.max(n, l.position + 1), 0),
  };
  const prevId = state.listId;
  state.lists.push(list);
  selectList(list.id);
  const { error } = await sb.from("lists").insert({ id: list.id, name, position: list.position });
  if (error) {
    state.lists = state.lists.filter((l) => l.id !== list.id);
    selectList(prevId);
    toast("Couldn't make that list. " + error.message);
  }
}

async function renameList(id, name) {
  const list = state.lists.find((l) => l.id === id);
  if (!list || name === list.name) return renderLists();
  const prev = list.name;
  list.name = name;
  renderLists();
  const { error } = await sb.from("lists").update({ name }).eq("id", list.id);
  if (error) { list.name = prev; renderLists(); toast("Couldn't rename that list. " + error.message); }
}

async function deleteList(id) {
  const list = state.lists.find((l) => l.id === id);
  state.confirmDeleteId = null;
  if (!list) return renderListConfirm();
  if (state.lists.length === 1) return toast("You need at least one list.");
  const removed = state.todos.filter((t) => t.list_id === list.id);
  state.lists = state.lists.filter((l) => l.id !== list.id);
  state.todos = state.todos.filter((t) => t.list_id !== list.id);
  selectList(state.lists[0].id);
  const { error } = await sb.from("lists").delete().eq("id", list.id);
  if (error) {
    state.lists.push(list);
    state.lists.sort(byPosition);
    state.todos.push(...removed);
    selectList(list.id);
    return toast("Couldn't delete that list. " + error.message);
  }
  toast(`Deleted “${list.name}”`);
}

/* ---------------- List ---------------- */
function sortOpen(a, b) {
  return (a.due_date ?? "9999-12-31").localeCompare(b.due_date ?? "9999-12-31") || b.created_at.localeCompare(a.created_at);
}
function sortDone(a, b) { return b.updated_at.localeCompare(a.updated_at); }

function renderItem(t) {
  const open = state.openId === t.id;
  const editing = state.editingId === t.id;
  const due = dueInfo(t.due_date);

  const check = el("button", {
    class: "check", html: ICONS.check, "aria-label": t.is_complete ? "Mark as not done" : "Mark as done",
    onclick: (e) => { e.stopPropagation(); toggleDone(t.id, e.currentTarget.closest(".item")); },
  });

  let titleNode;
  if (editing) {
    titleNode = el("input", { class: "title-input", value: t.title, maxlength: 500, "aria-label": "Edit title" });
    let finished = false;
    const finish = (save) => {
      if (finished) return;
      finished = true;
      const v = titleNode.value.trim();
      state.editingId = null;
      if (save && v && v !== t.title) patchTodo(t.id, { title: v });
      else render();
    };
    titleNode.addEventListener("keydown", (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    titleNode.addEventListener("blur", () => finish(true));
    titleNode.addEventListener("click", (e) => e.stopPropagation());
    requestAnimationFrame(() => { titleNode.focus(); titleNode.select(); });
  } else {
    titleNode = el("span", { class: "title" }, t.title);
    // Clicking the title of an opened to-do renames it.
    titleNode.addEventListener("click", (e) => {
      if (state.openId !== t.id) return;
      e.stopPropagation();
      state.editingId = t.id;
      render();
    });
  }

  const steps = stepsOf(t.id);
  const stepsDone = steps.filter((s) => s.is_complete).length;
  const meta = el("div", { class: "meta" },
    due ? chip(due.cls, ICONS.cal, steps.length ? `Done by ${due.label}` : due.label) : null,
    steps.length ? stepsChip(stepsDone, steps.length) : null,
    t.notes ? chip("", ICONS.note, "Notes") : null,
  );

  const notes = el("textarea", { class: "notes", placeholder: "Add notes…", rows: 3, "aria-label": "Notes" });
  notes.value = t.notes ?? "";
  notes.addEventListener("blur", () => {
    const v = notes.value.trim() || null;
    if (v !== (t.notes ?? null)) patchTodo(t.id, { notes: v });
  });

  const dateInput = el("input", { type: "date", value: t.due_date ?? "", "aria-label": "Due date" });
  dateInput.addEventListener("change", () => patchTodo(t.id, { due_date: dateInput.value || null }));

  const panel = el("div", { class: "panel" },
    el("div", {},
      el("div", { class: "panel-inner", onclick: (e) => e.stopPropagation() },
        renderSteps(t, steps),
        notes,
        el("div", { class: "panel-row" },
          el("label", { class: "field" }, "Due", dateInput),
          el("button", {
            class: "danger-btn", html: ICONS.trash, type: "button",
            onclick: () => deleteTodos([t.id], "To-do deleted"),
          }),
        ),
      ),
    ),
  );
  panel.querySelector(".danger-btn").append("Delete");

  const li = el("li", {
    class: `card item${t.is_complete ? " done" : ""}${open ? " open" : ""}`,
    "data-id": t.id,
    onclick: () => toggleOpen(t.id),
  },
    check,
    el("div", { class: "body" }, titleNode, meta, panel),
    el("button", {
      class: "expand", html: ICONS.chevron, "aria-label": open ? "Collapse" : "Expand", "aria-expanded": String(open),
      onclick: (e) => { e.stopPropagation(); toggleOpen(t.id); },
    }),
  );
  return li;
}

function chip(cls, icon, label) { const c = el("span", { class: `chip ${cls}`, html: icon }); c.append(label); return c; }
function progressBar(n, total) {
  return el("span", { class: "bar" }, el("i", { style: `width: ${total ? Math.round((n / total) * 100) : 0}%` }));
}
function stepsChip(n, total) {
  const c = chip(n === total ? "steps-done" : "", ICONS.steps, `${n} of ${total} steps`);
  c.append(progressBar(n, total));
  return c;
}

// "Break it down" asks for a finish line first, then plans the steps back from it.
function makePlan(t, due) {
  state.askDueFor = null;
  const titles = breakDown(t.title);
  if (due && due !== t.due_date) patchTodo(t.id, { due_date: due }, { rerender: !titles.length });
  if (!titles.length) {
    render();
    return toast("This one looks small enough to do in one go. Add your own steps below if it helps.");
  }
  addSteps(t, titles, { dates: planDates(titles.length, due) });
  toast(due ? "Here’s your plan to the finish line. Edit any step to make it yours." : "Here’s a plan. Edit any step to make it yours.");
}

// Steps whose date has passed and aren't done.
function behindSteps(steps) {
  const today = isoDate(new Date());
  return steps.filter((s) => !s.is_complete && s.due_date && s.due_date < today);
}

// Spreads the unfinished steps again, from today to the finish line.
async function replan(t, due) {
  state.replanFor = null;
  const left = stepsOf(t.id).filter((s) => !s.is_complete);
  const dates = planDates(left.length, due);
  if (due !== t.due_date) patchTodo(t.id, { due_date: due }, { rerender: false });
  left.forEach((s, i) => patchTodo(s.id, { due_date: dates[i] }, { rerender: false }));
  render();
  const label = parseDate(due).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  toast(`New plan, still finishing ${label}. You’ve got this.`);
}

function renderBehind(t, steps) {
  const behind = behindSteps(steps).length;
  if (!behind) return null;
  const today = isoDate(new Date());
  const canKeepDate = t.due_date && t.due_date >= today;
  if (state.replanFor === t.id || !canKeepDate) {
    const date = el("input", { type: "date", value: canKeepDate ? t.due_date : "", min: today, "aria-label": "New finish date" });
    const go = el("button", { type: "button", class: "replan-btn", html: ICONS.replan, onclick: () => date.value && replan(t, date.value) });
    go.append("Re-plan");
    return el("div", { class: "behind ask-due" },
      el("span", {}, el("b", {}, behind === 1 ? "1 step is behind." : `${behind} steps are behind.`), " That’s okay. Pick a new finish line:"),
      date, go);
  }
  const go = el("button", { type: "button", class: "replan-btn", html: ICONS.replan, onclick: () => replan(t, t.due_date) });
  go.append("Re-plan");
  const other = el("button", { type: "button", class: "text-btn", onclick: () => { state.replanFor = t.id; render(); } }, "Pick a new date");
  return el("div", { class: "behind" },
    el("span", {}, el("b", {}, behind === 1 ? "You’re 1 step behind." : `You’re ${behind} steps behind.`), " That’s okay. Want a new plan that still makes it?"),
    go, other);
}

function renderSteps(t, steps) {
  const wrap = el("div", { class: "steps" });
  if (steps.length) {
    const n = steps.filter((s) => s.is_complete).length;
    const finish = el("div", { class: "finish" },
      el("span", { html: ICONS.flag }),
      progressBar(n, steps.length));
    finish.firstChild.append(n === steps.length ? "Finished! " : "Finish line: ",
      el("b", {}, t.due_date ? parseDate(t.due_date).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : "no date yet"));
    wrap.append(finish);
    const behind = renderBehind(t, steps);
    if (behind) wrap.append(behind);
  }
  if (steps.length) {
    let delay = 0;
    wrap.append(el("ul", { class: "step-list" }, ...steps.map((s) => {
      const li = renderStep(s);
      if (state.freshSteps.has(s.id) && !reduceMotion) { li.classList.add("enter"); li.style.animationDelay = `${delay++ * 70}ms`; }
      return li;
    })));
  } else if (state.askDueFor === t.id) {
    const date = el("input", { type: "date", value: t.due_date ?? "", min: isoDate(new Date()), "aria-label": "Finish date" });
    const go = el("button", { type: "button", class: "breakdown-btn", html: ICONS.spark, onclick: () => makePlan(t, date.value || null) });
    go.append("Make my plan");
    wrap.append(el("div", { class: "ask-due" }, "When does this need to be done?", date, go,
      el("button", { type: "button", class: "text-btn", onclick: () => makePlan(t, null) }, "No date")));
    requestAnimationFrame(() => { try { date.showPicker(); } catch {} });
  } else {
    const btn = el("button", {
      type: "button", class: "breakdown-btn", html: ICONS.spark,
      onclick: () => { state.askDueFor = t.id; render(); },
    });
    btn.append("Break it down");
    wrap.append(btn);
  }
  const add = el("input", {
    class: "step-add", maxlength: 500, "aria-label": "Add a step",
    placeholder: steps.length ? "Add a step" : "…or add your own first step",
  });
  add.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && add.value.trim()) addSteps(t, [add.value.trim()], { focusAdd: true });
  });
  wrap.append(add);
  return wrap;
}

function renderStep(s) {
  const title = el("input", { class: "step-title", value: s.title, maxlength: 500, "aria-label": "Step" });
  title.addEventListener("keydown", (e) => {
    if (e.key === "Enter") title.blur();
    if (e.key === "Escape") { title.value = s.title; title.blur(); }
  });
  title.addEventListener("blur", () => {
    const v = title.value.trim();
    if (!v) title.value = s.title;
    else if (v !== s.title) patchTodo(s.id, { title: v }, { rerender: false });
  });
  const due = dueInfo(s.due_date);
  return el("li", { class: `step${s.is_complete ? " done" : ""}` },
    el("button", {
      type: "button", class: "step-check", html: ICONS.check,
      "aria-label": s.is_complete ? "Mark step as not done" : "Mark step as done",
      onclick: () => patchTodo(s.id, { is_complete: !s.is_complete }),
    }),
    title,
    due ? el("span", { class: `step-date ${due.cls}` }, due.label) : el("span"),
    el("button", {
      type: "button", class: "step-del", html: ICONS.x, "aria-label": "Delete step",
      onclick: () => deleteTodos([s.id], "Step deleted"),
    }),
  );
}

function renderNextItem({ goal, step }) {
  const list = state.lists.find((l) => l.id === goal.list_id);
  const steps = stepsOf(goal.id);
  const due = dueInfo(step.due_date);
  const goalChip = el("span", { class: "chip goal-chip", style: `--tab-h: ${list ? hueOf(list) : HUES[0]}` }, el("span", { class: "dot" }), goal.title);
  // Tapping a next step opens its goal in its own list.
  const openGoal = () => { selectList(goal.list_id); state.openId = goal.id; render(); };
  return el("li", { class: "card item next-item", "data-id": step.id, onclick: openGoal },
    el("button", {
      class: "check", html: ICONS.check, "aria-label": "Mark step as done",
      onclick: (e) => { e.stopPropagation(); completeNext(goal, step, e.currentTarget.closest(".item")); },
    }),
    el("div", { class: "body" },
      el("span", { class: "title" }, step.title),
      el("div", { class: "meta" }, goalChip, due ? chip(due.cls, ICONS.cal, due.label) : null,
        stepsChip(steps.filter((s) => s.is_complete).length, steps.length))),
    el("button", { class: "expand", html: ICONS.chevron, "aria-label": "Open goal", onclick: (e) => { e.stopPropagation(); openGoal(); } }),
  );
}

function completeNext(goal, step, node) {
  node?.classList.add("done");
  patchTodo(step.id, { is_complete: true }, { rerender: false });
  const after = stepsOf(goal.id).find((s) => !s.is_complete);
  toast(after ? `Nice! Next up: ${after.title}` : `You finished every step of “${goal.title}”!`, {
    label: "Undo", run: () => patchTodo(step.id, { is_complete: false }),
  });
  if (after) state.fresh.add(after.id);
  clearTimeout(completeNext.timer);
  completeNext.timer = setTimeout(render, reduceMotion ? 0 : 550);
}

function toggleOpen(id) {
  if (state.editingId) return;
  const list = $("list");
  const prevId = state.openId;
  state.openId = prevId === id ? null : id;
  // Toggle classes in place so the panel animates open/closed.
  list.querySelectorAll(".item").forEach((n) => {
    const isOpen = n.dataset.id === state.openId;
    n.classList.toggle("open", isOpen);
    n.querySelector(".expand").setAttribute("aria-expanded", String(isOpen));
  });
}

function toggleDone(id, node) {
  const t = state.todos.find((x) => x.id === id);
  if (!t) return;
  const next = !t.is_complete;
  node?.classList.toggle("done", next);
  patchTodo(id, { is_complete: next }, { rerender: false });
  renderProgress();
  // Let the check animation play before the item slides to its new place.
  clearTimeout(toggleDone.timer);
  toggleDone.timer = setTimeout(render, reduceMotion ? 0 : 550);
}

function render() {
  renderProgress();
  const list = $("list");
  const empty = $("empty");

  // FLIP: remember where each item was, so reordering glides instead of jumping.
  const before = new Map([...list.querySelectorAll(".item")].map((n) => [n.dataset.id, n.getBoundingClientRect().top]));

  if (state.loading) {
    list.replaceChildren(...[0, 1, 2].map(() => el("li", { class: "skeleton" })));
    empty.hidden = true;
    return;
  }

  const isNext = state.listId === NEXT;
  $("composer").hidden = isNext;
  document.querySelector(".toolbar").hidden = isNext;
  const open = state.todos.filter((t) => inList(t) && !t.is_complete).sort(sortOpen);
  const done = state.todos.filter((t) => inList(t) && t.is_complete).sort(sortDone);
  const nodes = [];
  if (isNext) nodes.push(...nextSteps().map(renderNextItem));
  if (state.filter !== "done") nodes.push(...open.map(renderItem));
  if (state.filter === "all" && done.length && open.length) nodes.push(el("li", { class: "section-label" }, "Completed"));
  if (state.filter !== "active") nodes.push(...done.map(renderItem));
  list.replaceChildren(...nodes);

  const shown = list.querySelectorAll(".item").length;
  empty.hidden = shown > 0;
  if (!shown) empty.replaceChildren(emptyState());

  if (reduceMotion) { state.fresh.clear(); return; }
  list.querySelectorAll(".item").forEach((n) => {
    const id = n.dataset.id;
    if (state.fresh.has(id)) {
      n.animate(
        [{ opacity: 0, transform: "translateY(-10px) scale(.98)" }, { opacity: 1, transform: "none" }],
        { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" },
      );
    } else if (before.has(id)) {
      const dy = before.get(id) - n.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) {
        n.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" });
      }
    }
  });
  state.fresh.clear();
}

function emptyState() {
  if (state.listId === NEXT) {
    return el("div", { class: "empty" }, el("h2", {}, "No next steps yet"),
      el("p", {}, "Open a goal in any list and tap “Break it down.” Its first step shows up here."));
  }
  const items = state.todos.filter(inList);
  const total = items.length;
  const allDone = total > 0 && items.every((t) => t.is_complete);
  const [title, body] =
    state.filter === "done" ? ["Nothing finished yet", "Tick something off — it’ll land here."]
    : allDone || (state.filter === "active" && total) ? ["All clear", "You’ve done everything on your list."]
    : ["Start with one thing", "Type above and press Enter."];
  const art = el("div", {
    html: `<svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <circle cx="60" cy="60" r="44" fill="var(--accent-soft)"/>
      <circle cx="60" cy="60" r="30" stroke="var(--accent)" stroke-width="3" stroke-dasharray="4 7" stroke-linecap="round" opacity=".5"/>
      <path d="M46 61l10 10 19-22" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="98" cy="30" r="4" fill="var(--glow-2)"/><circle cx="22" cy="86" r="5" fill="var(--glow-1)"/><circle cx="100" cy="92" r="3" fill="var(--accent)" opacity=".4"/>
    </svg>`,
  });
  return el("div", { class: "empty" }, art, el("h2", {}, title), el("p", {}, body));
}

/* ---------------- Filters ---------------- */
const FILTERS = ["all", "active", "done"];
function setFilter(f) {
  state.filter = f;
  $("indicator").style.transform = `translateX(${FILTERS.indexOf(f) * 100}%)`;
  $("filters").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filter === f)));
  render();
}
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-filter]");
  if (b) setFilter(b.dataset.filter);
});
$("clearDone").addEventListener("click", () => {
  const ids = state.todos.filter((t) => inList(t) && t.is_complete).map((t) => t.id);
  deleteTodos(ids, `Cleared ${ids.length} completed`);
});

/* ---------------- Composer ---------------- */
const newTitle = $("newTitle"), newDue = $("newDue");
function syncComposer() {
  $("addBtn").disabled = !newTitle.value.trim();
  const info = dueInfo(newDue.value);
  $("dueLabel").textContent = info ? info.label : "Due";
  $("duePill").classList.toggle("set", !!info);
  $("clearDue").hidden = !info;
}
newTitle.addEventListener("input", syncComposer);
newDue.addEventListener("change", syncComposer);
newDue.addEventListener("click", () => { try { newDue.showPicker(); } catch {} });
$("clearDue").addEventListener("click", () => { newDue.value = ""; syncComposer(); });
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const title = newTitle.value.trim();
  if (!title) return;
  addTodo(title, newDue.value);
  newTitle.value = "";
  newDue.value = "";
  syncComposer();
  newTitle.focus();
});

/* ---------------- Keyboard ---------------- */
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (!typing && !e.metaKey && !e.ctrlKey && (e.key === "n" || e.key === "/") && !$("appView").hidden) {
    e.preventDefault();
    newTitle.focus();
  }
  if (e.key === "Escape") closeListMenu();
  if (e.key === "Escape" && !typing && state.openId && !state.editingId) toggleOpen(state.openId);
});

// Lets phones install the site as an app (see sw.js).
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// Refresh relative dates ("Today", greeting) when the tab regains focus.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.user) { renderHero(); render(); }
});
</script>
</body>
