<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23D9582B'/><path d='M20 33l8 8 16-18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5EFE6;
    --glow-1: rgba(255, 164, 120, .42);
    --glow-2: rgba(168, 156, 255, .26);
    --glow-3: rgba(120, 200, 170, .20);
    --surface: rgba(255, 253, 249, .74);
    --surface-solid: #FFFDF9;
    --surface-hover: rgba(255, 253, 249, .95);
    --ink: #1E1A15;
    --ink-2: #5A5147;
    --muted: #978C7F;
    --line: rgba(70, 50, 30, .10);
    --line-strong: rgba(70, 50, 30, .18);
    --accent: #D9582B;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(217, 88, 43, .12);
    --ok: #2F8A62;
    --warn: #B7791F;
    --danger: #C2412D;
    --danger-soft: rgba(194, 65, 45, .10);
    --shadow: 0 1px 2px rgba(60, 40, 20, .04), 0 10px 30px -12px rgba(60, 40, 20, .18);
    --shadow-lift: 0 2px 4px rgba(60, 40, 20, .05), 0 18px 40px -14px rgba(60, 40, 20, .28);
    --ease: cubic-bezier(.2, .8, .2, 1);
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13110E;
      --glow-1: rgba(240, 120, 70, .20);
      --glow-2: rgba(130, 110, 255, .16);
      --glow-3: rgba(60, 170, 130, .10);
      --surface: rgba(34, 30, 26, .70);
      --surface-solid: #1F1B17;
      --surface-hover: rgba(42, 37, 32, .90);
      --ink: #F4EDE3;
      --ink-2: #C3B8AA;
      --muted: #8A8074;
      --line: rgba(255, 240, 220, .08);
      --line-strong: rgba(255, 240, 220, .16);
      --accent: #F0804F;
      --accent-ink: #1A0F09;
      --accent-soft: rgba(240, 128, 79, .15);
      --ok: #5CC296;
      --warn: #E0A84A;
      --danger: #F07A66;
      --danger-soft: rgba(240, 122, 102, .12);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -12px rgba(0, 0, 0, .6);
      --shadow-lift: 0 2px 4px rgba(0, 0, 0, .3), 0 18px 40px -14px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13110E;
    --glow-1: rgba(240, 120, 70, .20);
    --glow-2: rgba(130, 110, 255, .16);
    --glow-3: rgba(60, 170, 130, .10);
    --surface: rgba(34, 30, 26, .70);
    --surface-solid: #1F1B17;
    --surface-hover: rgba(42, 37, 32, .90);
    --ink: #F4EDE3;
    --ink-2: #C3B8AA;
    --muted: #8A8074;
    --line: rgba(255, 240, 220, .08);
    --line-strong: rgba(255, 240, 220, .16);
    --accent: #F0804F;
    --accent-ink: #1A0F09;
    --accent-soft: rgba(240, 128, 79, .15);
    --ok: #5CC296;
    --warn: #E0A84A;
    --danger: #F07A66;
    --danger-soft: rgba(240, 122, 102, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -12px rgba(0, 0, 0, .6);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .3), 0 18px 40px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background .4s var(--ease), color .4s var(--ease);
  }
  /* Soft drifting color field behind everything */
  .aura { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .aura i {
    position: absolute; border-radius: 50%; filter: blur(80px);
    animation: drift 28s ease-in-out infinite alternate;
  }
  .aura i:nth-child(1) { width: 520px; height: 520px; background: var(--glow-1); top: -160px; left: -120px; }
  .aura i:nth-child(2) { width: 460px; height: 460px; background: var(--glow-2); top: 20%; right: -180px; animation-delay: -9s; }
  .aura i:nth-child(3) { width: 420px; height: 420px; background: var(--glow-3); bottom: -200px; left: 20%; animation-delay: -18s; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(40px, 30px, 0) scale(1.08); }
  }
  /* Subtle paper grain */
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
  }

  .shell {
    position: relative; z-index: 1;
    max-width: 640px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px 96px;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; box-shadow: 0 4px 14px -4px var(--accent);
  }
  .brand-mark svg { width: 14px; height: 14px; }
  .top-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    color: var(--ink-2); transition: background .2s, color .2s;
  }
  .icon-btn:hover { background: var(--surface); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }
  .who {
    font-size: 13px; color: var(--muted); max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- Hero ---------- */
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px;
  }
  h1 {
    font-family: var(--serif); font-weight: 400; font-size: clamp(44px, 9vw, 64px);
    line-height: .95; letter-spacing: -.02em; margin: 0;
  }
  h1 em { font-style: italic; color: var(--ink-2); }
  .subtitle { margin: 12px 0 0; color: var(--ink-2); font-size: 15px; }

  .ring { position: relative; width: 76px; height: 76px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--line-strong); }
  .ring .fill {
    stroke: var(--accent); stroke-linecap: round;
    transition: stroke-dashoffset .8s var(--ease), stroke .4s;
  }
  .ring.complete .fill { stroke: var(--ok); }
  .ring-label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--serif); font-size: 24px; line-height: 1;
  }
  .ring-label small { display: block; font-family: var(--sans); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; text-align: center; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
  }

  /* ---------- Composer ---------- */
  .composer { padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 8px; transition: box-shadow .3s var(--ease), border-color .3s; }
  .composer:focus-within { box-shadow: var(--shadow-lift), 0 0 0 4px var(--accent-soft); border-color: transparent; }
  .composer .plus { color: var(--muted); flex: none; display: grid; }
  .composer .plus svg { width: 20px; height: 20px; }
  .composer input[type="text"] {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-size: 17px; padding: 12px 4px;
  }
  .composer input::placeholder { color: var(--muted); }
  .pill {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 12px; border-radius: 12px; font-size: 13px; font-weight: 500;
    color: var(--ink-2); white-space: nowrap; transition: background .2s, color .2s;
  }
  .pill:hover { background: var(--accent-soft); color: var(--ink); }
  .pill svg { width: 16px; height: 16px; }
  .pill.set { background: var(--accent-soft); color: var(--accent); }
  .pill input[type="date"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; border: 0;
  }
  .add-btn {
    height: 42px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
    font-weight: 600; font-size: 14px; flex: none;
    box-shadow: 0 6px 18px -6px var(--accent);
    transition: transform .2s var(--ease), opacity .2s, box-shadow .2s;
  }
  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -8px var(--accent); }
  .add-btn:active { transform: translateY(0) scale(.97); }
  .add-btn:disabled { opacity: .45; transform: none; box-shadow: none; cursor: default; }
  .clear-due { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); margin-left: -6px; }
  .clear-due:hover { background: var(--accent-soft); }
  .clear-due svg { width: 12px; height: 12px; }

  /* ---------- Filters ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 14px; }
  .segmented {
    position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .segmented .indicator {
    position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3);
    border-radius: 10px; background: var(--surface-solid); box-shadow: var(--shadow);
    transition: transform .35s var(--ease);
  }
  .segmented button {
    position: relative; z-index: 1; padding: 7px 14px; font-size: 13px; font-weight: 500; color: var(--muted);
    transition: color .2s; display: flex; gap: 6px; align-items: center; justify-content: center;
  }
  .segmented button[aria-pressed="true"] { color: var(--ink); }
  .segmented .count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .text-btn { font-size: 13px; color: var(--muted); padding: 6px 8px; border-radius: 8px; transition: color .2s, background .2s; }
  .text-btn:hover { color: var(--danger); background: var(--danger-soft); }

  /* ---------- List ---------- */
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
    padding: 16px 14px 16px 16px; cursor: pointer;
    transition: background .2s, box-shadow .3s var(--ease), transform .2s var(--ease);
  }
  .item:hover { background: var(--surface-hover); box-shadow: var(--shadow-lift); }
  .item.open { background: var(--surface-hover); box-shadow: var(--shadow-lift); cursor: default; }
  .item.leaving { animation: leave .28s var(--ease) forwards; pointer-events: none; }
  @keyframes leave { to { opacity: 0; transform: translateX(24px) scale(.98); } }

  .check {
    width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; flex: none;
    border: 1.75px solid var(--line-strong); display: grid; place-items: center;
    transition: background .25s var(--ease), border-color .25s, transform .2s var(--ease);
  }
  .check:hover { border-color: var(--accent); transform: scale(1.08); }
  .check svg { width: 14px; height: 14px; }
  .check path {
    fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .08s var(--ease);
  }
  .done .check { background: var(--ok); border-color: var(--ok); animation: pop .35s var(--ease); }
  .done .check path { stroke-dashoffset: 0; stroke: #fff; }
  @keyframes pop { 50% { transform: scale(1.18); } }

  .body { min-width: 0; }
  .title {
    font-size: 16px; line-height: 1.4; word-wrap: break-word; position: relative; display: inline;
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0% 1.5px; background-repeat: no-repeat; background-position: 0 58%;
    transition: background-size .35s var(--ease), color .3s;
  }
  .done .title { color: var(--muted); background-size: 100% 1.5px; }
  .title-input {
    width: 100%; font-size: 16px; line-height: 1.4; border: 0; outline: 0; padding: 0;
    background: transparent; border-bottom: 1.5px solid var(--accent);
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .meta:empty { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500;
    padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--ink-2);
  }
  .chip svg { width: 12px; height: 12px; }
  .chip.today { background: var(--accent-soft); color: var(--accent); }
  .chip.overdue { background: var(--danger-soft); color: var(--danger); }
  .done .chip { background: var(--line); color: var(--muted); }

  .expand { color: var(--muted); width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; transition: transform .3s var(--ease), background .2s, color .2s; }
  .expand:hover { background: var(--line); color: var(--ink); }
  .expand svg { width: 16px; height: 16px; }
  .open .expand { transform: rotate(180deg); }
  .open .title { cursor: text; }

  .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
  .open .panel { grid-template-rows: 1fr; }
  .panel > div { overflow: hidden; }
  .panel-inner { padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .notes {
    width: 100%; min-height: 76px; resize: vertical; border-radius: 14px; padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--line); outline: 0; font-size: 14px; line-height: 1.55;
    transition: border-color .2s, box-shadow .2s;
  }
  .notes:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .notes::placeholder { color: var(--muted); }
  .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .field { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .field input[type="date"] {
    border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 13px; outline: 0;
  }
  .field input[type="date"]:focus { border-color: var(--accent); }
  .danger-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--danger);
    padding: 7px 12px; border-radius: 10px; transition: background .2s;
  }
  .danger-btn:hover { background: var(--danger-soft); }
  .danger-btn svg { width: 15px; height: 15px; }
  .hint { font-size: 12px; color: var(--muted); }

  /* ---------- Section label ---------- */
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    margin: 22px 4px 4px; list-style: none;
  }

  /* ---------- Empty + loading ---------- */
  .empty { text-align: center; padding: 56px 20px 40px; }
  .empty svg { width: 120px; height: 120px; margin-bottom: 10px; }
  .empty h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; margin: 0 0 6px; }
  .empty p { margin: 0; color: var(--ink-2); }
  .skeleton { height: 58px; border-radius: 22px; background: linear-gradient(90deg, var(--line) 0%, var(--line-strong) 50%, var(--line) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; opacity: .6; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .footer-note { text-align: center; margin-top: 40px; font-size: 12px; color: var(--muted); }
  kbd { font-family: var(--sans); font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); }

  /* ---------- Auth ---------- */
  .auth { min-height: calc(100vh - 140px); display: grid; place-items: center; }
  .auth-card { width: 100%; max-width: 420px; padding: 36px 32px 28px; border-radius: 28px; }
  .auth h1 { font-size: 52px; margin-bottom: 10px; }
  .auth .lede { color: var(--ink-2); margin: 0 0 28px; }
  .auth label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .auth input {
    width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface-solid);
    padding: 0 16px; font-size: 15px; outline: 0; margin-bottom: 16px; transition: border-color .2s, box-shadow .2s;
  }
  .auth input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .auth .add-btn { width: 100%; height: 50px; font-size: 15px; margin-top: 6px; }
  .auth .switch { text-align: center; margin-top: 18px; font-size: 14px; color: var(--ink-2); }
  .auth .switch button { color: var(--accent); font-weight: 600; }
  .notice { font-size: 14px; padding: 12px 14px; border-radius: 14px; margin-bottom: 16px; }
  .notice.error { background: var(--danger-soft); color: var(--danger); }
  .notice.info { background: var(--accent-soft); color: var(--ink); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 10;
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 18px; border-radius: 16px;
    background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--shadow-lift);
    transition: transform .35s var(--ease), opacity .35s var(--ease); max-width: calc(100vw - 32px);
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .toast button { color: var(--accent); font-weight: 600; padding: 4px 8px; border-radius: 8px; }
  .toast button:hover { background: rgba(255, 255, 255, .1); }

  @media (max-width: 520px) {
    .topbar { margin-bottom: 28px; }
    .who { display: none; }
    .ring { width: 64px; height: 64px; }
    .composer { flex-wrap: wrap; padding: 8px 8px 8px 16px; }
    .composer input[type="text"] { flex-basis: calc(100% - 40px); }
    .composer .spacer { flex: 1; }
    .toolbar { flex-wrap: wrap; }
    .segmented button { padding: 7px 10px; }
    .auth-card { padding: 28px 22px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Today
    </div>
    <div class="top-actions">
      <span class="who" id="who" hidden></span>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="signOutBtn" aria-label="Sign out" title="Sign out" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ Auth ============ -->
  <main class="auth" id="authView" hidden>
    <form class="card auth-card" id="authForm" novalidate>
      <div class="eyebrow" id="authEyebrow">Welcome back</div>
      <h1 id="authTitle">A calmer <em>list.</em></h1>
      <p class="lede" id="authLede">Sign in to pick up where you left off.</p>
      <div class="notice" id="authNotice" hidden></div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required>
      <button class="add-btn" id="authSubmit" type="submit">Sign in</button>
      <div class="switch"><span id="switchText">New here?</span> <button type="button" id="switchMode">Create an account</button></div>
    </form>
  </main>

  <!-- ============ App ============ -->
  <main id="appView" hidden>
    <section class="hero">
      <div>
        <div class="eyebrow" id="dateLine"></div>
        <h1 id="greeting"></h1>
        <p class="subtitle" id="subtitle">&nbsp;</p>
      </div>
      <div class="ring" id="ring" aria-hidden="true">
        <svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="34"/><circle class="fill" id="ringFill" cx="40" cy="40" r="34"/></svg>
        <div class="ring-label"><div><span id="ringPct">0</span><small>done</small></div></div>
      </div>
    </section>

    <form class="card composer" id="composer" autocomplete="off">
      <span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <input type="text" id="newTitle" placeholder="What needs doing?" maxlength="500" aria-label="New to-do">
      <span class="spacer"></span>
      <label class="pill" id="duePill" title="Set a due date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        <span id="dueLabel">Due</span>
        <input type="date" id="newDue" aria-label="Due date">
      </label>
      <button type="button" class="clear-due" id="clearDue" aria-label="Clear due date" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="add-btn" type="submit" id="addBtn" disabled>Add</button>
    </form>

    <div class="toolbar">
      <div class="segmented" id="filters" role="group" aria-label="Filter">
        <span class="indicator" id="indicator"></span>
        <button type="button" data-filter="all" aria-pressed="true">All <span class="count" data-count="all"></span></button>
        <button type="button" data-filter="active" aria-pressed="false">Open <span class="count" data-count="active"></span></button>
        <button type="button" data-filter="done" aria-pressed="false">Done <span class="count" data-count="done"></span></button>
      </div>
      <button class="text-btn" id="clearDone" hidden>Clear completed</button>
    </div>

    <ul class="list" id="list" aria-live="polite"></ul>
    <div id="empty" hidden></div>

    <p class="footer-note">Press <kbd>N</kbd> to add · open a to-do and click its title to rename it</p>
  </main>
</div>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastAction" hidden>Undo</button></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";

const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = {
  user: null,
  todos: [],
  loading: true,
  filter: "all",
  openId: null,
  editingId: null,
  fresh: new Set(),
};

/* ---------------- Icons ---------------- */
const ICONS = {
  check: '<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
};

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v; // only ever used with the static ICONS above
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

/* ---------------- Theme ---------------- */
function storedTheme() { try { return localStorage.getItem("theme"); } catch { return null; } }
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
applyTheme(storedTheme());
$("themeBtn").addEventListener("click", () => {
  const isDark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = isDark ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("theme", next); } catch {}
});

/* ---------------- Toast ---------------- */
let toastTimer;
function toast(text, action) {
  $("toastText").textContent = text;
  const btn = $("toastAction");
  btn.hidden = !action;
  btn.onclick = action ? () => { hideToast(); action.run(); } : null;
  if (action) btn.textContent = action.label;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 5000 : 3200);
}
function hideToast() { $("toast").classList.remove("show"); }

/* ---------------- Auth ---------------- */
let authMode = "signin";
function setAuthMode(mode) {
  authMode = mode;
  const up = mode === "signup";
  $("authEyebrow").textContent = up ? "Get started" : "Welcome back";
  $("authTitle").innerHTML = up ? "Begin with <em>one thing.</em>" : "A calmer <em>list.</em>";
  $("authLede").textContent = up ? "Create an account. Your to-dos are private to you." : "Sign in to pick up where you left off.";
  $("authSubmit").textContent = up ? "Create account" : "Sign in";
  $("switchText").textContent = up ? "Already have an account?" : "New here?";
  $("switchMode").textContent = up ? "Sign in" : "Create an account";
  $("password").autocomplete = up ? "new-password" : "current-password";
  $("authNotice").hidden = true;
}
function authNotice(text, kind) {
  const n = $("authNotice");
  n.textContent = text;
  n.className = `notice ${kind}`;
  n.hidden = false;
}
$("switchMode").addEventListener("click", () => setAuthMode(authMode === "signin" ? "signup" : "signin"));

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || password.length < 6) return authNotice("Enter your email and a password of at least 6 characters.", "error");
  const btn = $("authSubmit");
  btn.disabled = true;
  try {
    if (authMode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) authNotice(error.message, "error");
    } else {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { emailRedirectTo: location.origin + location.pathname },
      });
      if (error) authNotice(error.message, "error");
      else if (!data.session) authNotice("Almost there — check your inbox for a confirmation link, then come back and sign in.", "info");
    }
  } finally {
    btn.disabled = false;
  }
});

$("signOutBtn").addEventListener("click", () => sb.auth.signOut());

let shownUserId; // undefined until the first auth event
function setUser(user) {
  const id = user?.id ?? null;
  if (id === shownUserId) return;
  shownUserId = id;
  state.user = user;
  $("authView").hidden = !!user;
  $("appView").hidden = !user;
  $("signOutBtn").hidden = !user;
  $("who").hidden = !user;
  if (user) {
    $("who").textContent = user.email;
    state.todos = [];
    state.loading = true;
    renderHero();
    render();
    loadTodos();
  } else {
    setAuthMode("signin");
    $("password").value = "";
  }
}

// Supabase warns against awaiting other client calls inside this callback, so defer.
sb.auth.onAuthStateChange((_event, session) => setTimeout(() => setUser(session?.user ?? null), 0));

/* ---------------- Data ---------------- */
async function loadTodos() {
  const { data, error } = await sb.from("todos").select("*");
  state.loading = false;
  if (error) { toast("Couldn't load your to-dos. " + error.message); render(); return; }
  state.todos = data;
  render();
}

async function addTodo(title, due_date) {
  const now = new Date().toISOString();
  const todo = {
    id: crypto.randomUUID(), title, notes: null, is_complete: false,
    due_date: due_date || null, created_at: now, updated_at: now,
  };
  state.todos.push(todo);
  state.fresh.add(todo.id);
  if (state.filter === "done") setFilter("all");
  render();
  const { error } = await sb.from("todos").insert({ id: todo.id, title, due_date: todo.due_date });
  if (error) {
    state.todos = state.todos.filter((t) => t.id !== todo.id);
    render();
    toast("Couldn't save that. " + error.message);
  }
}

async function patchTodo(id, fields, { rerender = true } = {}) {
  const todo = state.todos.find((t) => t.id === id);
  if (!todo) return;
  const prev = { ...todo };
  Object.assign(todo, fields, { updated_at: new Date().toISOString() });
  if (rerender) render();
  const { error } = await sb.from("todos").update(fields).eq("id", id);
  if (error) {
    Object.assign(todo, prev);
    render();
    toast("Couldn't update that. " + error.message);
  }
}

async function deleteTodos(ids, message) {
  const removed = state.todos.filter((t) => ids.includes(t.id));
  if (!removed.length) return;
  const nodes = [...$("list").querySelectorAll(".item")].filter((n) => ids.includes(n.dataset.id));
  nodes.forEach((n) => n.classList.add("leaving"));
  await new Promise((r) => setTimeout(r, reduceMotion ? 0 : 260));
  state.todos = state.todos.filter((t) => !ids.includes(t.id));
  if (ids.includes(state.openId)) state.openId = null;
  render();
  const { error } = await sb.from("todos").delete().in("id", ids);
  if (error) {
    state.todos.push(...removed);
    render();
    return toast("Couldn't delete. " + error.message);
  }
  toast(message, {
    label: "Undo",
    run: async () => {
      state.todos.push(...removed);
      render();
      const { error } = await sb.from("todos").insert(removed.map(({ user_id, ...row }) => row));
      if (error) {
        state.todos = state.todos.filter((t) => !ids.includes(t.id));
        render();
        toast("Couldn't restore. " + error.message);
      }
    },
  });
}

/* ---------------- Dates ---------------- */
const DAY = 86400000;
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function dueInfo(s) {
  if (!s) return null;
  const date = parseDate(s);
  const diff = Math.round((date - startOfToday()) / DAY);
  if (diff < -1) return { label: `${-diff} days overdue`, cls: "overdue" };
  if (diff === -1) return { label: "Yesterday", cls: "overdue" };
  if (diff === 0) return { label: "Today", cls: "today" };
  if (diff === 1) return { label: "Tomorrow", cls: "" };
  if (diff < 7) return { label: date.toLocaleDateString(undefined, { weekday: "long" }), cls: "" };
  return {
    label: date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: date.getFullYear() === new Date().getFullYear() ? undefined : "numeric" }),
    cls: "",
  };
}

/* ---------------- Hero ---------------- */
function renderHero() {
  const now = new Date();
  const h = now.getHours();
  const greet = h < 5 ? ["Still", "up?"] : h < 12 ? ["Good", "morning."] : h < 18 ? ["Good", "afternoon."] : ["Good", "evening."];
  $("dateLine").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  $("greeting").replaceChildren(greet[0] + " ", el("em", {}, greet[1]));
}

function renderProgress() {
  const total = state.todos.length;
  const done = state.todos.filter((t) => t.is_complete).length;
  const open = total - done;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const C = 2 * Math.PI * 34;
  const fill = $("ringFill");
  fill.style.strokeDasharray = C;
  fill.style.strokeDashoffset = C * (1 - pct / 100);
  $("ringPct").textContent = pct + "%";
  $("ring").classList.toggle("complete", total > 0 && open === 0);

  const overdue = state.todos.filter((t) => !t.is_complete && dueInfo(t.due_date)?.cls === "overdue").length;
  const today = state.todos.filter((t) => !t.is_complete && t.due_date && dueInfo(t.due_date).cls === "today").length;
  let sub;
  if (state.loading) sub = "Gathering your list…";
  else if (!total) sub = "A blank page. What matters today?";
  else if (!open) sub = "Everything’s done. Enjoy the quiet.";
  else {
    sub = `${open} ${open === 1 ? "thing" : "things"} left`;
    if (today) sub += ` · ${today} due today`;
    if (overdue) sub += ` · ${overdue} overdue`;
  }
  $("subtitle").textContent = sub;

  $("filters").querySelector('[data-count="all"]').textContent = total || "";
  $("filters").querySelector('[data-count="active"]').textContent = open || "";
  $("filters").querySelector('[data-count="done"]').textContent = done || "";
  $("clearDone").hidden = !done;
}

/* ---------------- List ---------------- */
function sortOpen(a, b) {
  return (a.due_date ?? "9999-12-31").localeCompare(b.due_date ?? "9999-12-31") || b.created_at.localeCompare(a.created_at);
}
function sortDone(a, b) { return b.updated_at.localeCompare(a.updated_at); }

function renderItem(t) {
  const open = state.openId === t.id;
  const editing = state.editingId === t.id;
  const due = dueInfo(t.due_date);

  const check = el("button", {
    class: "check", html: ICONS.check, "aria-label": t.is_complete ? "Mark as not done" : "Mark as done",
    onclick: (e) => { e.stopPropagation(); toggleDone(t.id, e.currentTarget.closest(".item")); },
  });

  let titleNode;
  if (editing) {
    titleNode = el("input", { class: "title-input", value: t.title, maxlength: 500, "aria-label": "Edit title" });
    let finished = false;
    const finish = (save) => {
      if (finished) return;
      finished = true;
      const v = titleNode.value.trim();
      state.editingId = null;
      if (save && v && v !== t.title) patchTodo(t.id, { title: v });
      else render();
    };
    titleNode.addEventListener("keydown", (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    titleNode.addEventListener("blur", () => finish(true));
    titleNode.addEventListener("click", (e) => e.stopPropagation());
    requestAnimationFrame(() => { titleNode.focus(); titleNode.select(); });
  } else {
    titleNode = el("span", { class: "title" }, t.title);
    // Clicking the title of an opened to-do renames it.
    titleNode.addEventListener("click", (e) => {
      if (state.openId !== t.id) return;
      e.stopPropagation();
      state.editingId = t.id;
      render();
    });
  }

  const meta = el("div", { class: "meta" },
    due ? el("span", { class: `chip ${due.cls}`, html: ICONS.cal }) : null,
    t.notes ? el("span", { class: "chip", html: ICONS.note }) : null,
  );
  if (due) meta.firstChild.append(due.label);
  if (t.notes) meta.lastChild.append("Notes");

  const notes = el("textarea", { class: "notes", placeholder: "Add notes…", rows: 3, "aria-label": "Notes" });
  notes.value = t.notes ?? "";
  notes.addEventListener("blur", () => {
    const v = notes.value.trim() || null;
    if (v !== (t.notes ?? null)) patchTodo(t.id, { notes: v });
  });

  const dateInput = el("input", { type: "date", value: t.due_date ?? "", "aria-label": "Due date" });
  dateInput.addEventListener("change", () => patchTodo(t.id, { due_date: dateInput.value || null }));

  const panel = el("div", { class: "panel" },
    el("div", {},
      el("div", { class: "panel-inner", onclick: (e) => e.stopPropagation() },
        notes,
        el("div", { class: "panel-row" },
          el("label", { class: "field" }, "Due", dateInput),
          el("button", {
            class: "danger-btn", html: ICONS.trash, type: "button",
            onclick: () => deleteTodos([t.id], "To-do deleted"),
          }),
        ),
      ),
    ),
  );
  panel.querySelector(".danger-btn").append("Delete");

  const li = el("li", {
    class: `card item${t.is_complete ? " done" : ""}${open ? " open" : ""}`,
    "data-id": t.id,
    onclick: () => toggleOpen(t.id),
  },
    check,
    el("div", { class: "body" }, titleNode, meta, panel),
    el("button", {
      class: "expand", html: ICONS.chevron, "aria-label": open ? "Collapse" : "Expand", "aria-expanded": String(open),
      onclick: (e) => { e.stopPropagation(); toggleOpen(t.id); },
    }),
  );
  return li;
}

function toggleOpen(id) {
  if (state.editingId) return;
  const list = $("list");
  const prevId = state.openId;
  state.openId = prevId === id ? null : id;
  // Toggle classes in place so the panel animates open/closed.
  list.querySelectorAll(".item").forEach((n) => {
    const isOpen = n.dataset.id === state.openId;
    n.classList.toggle("open", isOpen);
    n.querySelector(".expand").setAttribute("aria-expanded", String(isOpen));
  });
}

function toggleDone(id, node) {
  const t = state.todos.find((x) => x.id === id);
  if (!t) return;
  const next = !t.is_complete;
  node?.classList.toggle("done", next);
  patchTodo(id, { is_complete: next }, { rerender: false });
  renderProgress();
  // Let the check animation play before the item slides to its new place.
  clearTimeout(toggleDone.timer);
  toggleDone.timer = setTimeout(render, reduceMotion ? 0 : 550);
}

function render() {
  renderProgress();
  const list = $("list");
  const empty = $("empty");

  // FLIP: remember where each item was, so reordering glides instead of jumping.
  const before = new Map([...list.querySelectorAll(".item")].map((n) => [n.dataset.id, n.getBoundingClientRect().top]));

  if (state.loading) {
    list.replaceChildren(...[0, 1, 2].map(() => el("li", { class: "skeleton" })));
    empty.hidden = true;
    return;
  }

  const open = state.todos.filter((t) => !t.is_complete).sort(sortOpen);
  const done = state.todos.filter((t) => t.is_complete).sort(sortDone);
  const nodes = [];
  if (state.filter !== "done") nodes.push(...open.map(renderItem));
  if (state.filter === "all" && done.length && open.length) nodes.push(el("li", { class: "section-label" }, "Completed"));
  if (state.filter !== "active") nodes.push(...done.map(renderItem));
  list.replaceChildren(...nodes);

  const shown = list.querySelectorAll(".item").length;
  empty.hidden = shown > 0;
  if (!shown) empty.replaceChildren(emptyState());

  if (reduceMotion) { state.fresh.clear(); return; }
  list.querySelectorAll(".item").forEach((n) => {
    const id = n.dataset.id;
    if (state.fresh.has(id)) {
      n.animate(
        [{ opacity: 0, transform: "translateY(-10px) scale(.98)" }, { opacity: 1, transform: "none" }],
        { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" },
      );
    } else if (before.has(id)) {
      const dy = before.get(id) - n.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) {
        n.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" });
      }
    }
  });
  state.fresh.clear();
}

function emptyState() {
  const total = state.todos.length;
  const allDone = total > 0 && state.todos.every((t) => t.is_complete);
  const [title, body] =
    state.filter === "done" ? ["Nothing finished yet", "Tick something off — it’ll land here."]
    : allDone || (state.filter === "active" && total) ? ["All clear", "You’ve done everything on your list."]
    : ["Start with one thing", "Type above and press Enter."];
  const art = el("div", {
    html: `<svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <circle cx="60" cy="60" r="44" fill="var(--accent-soft)"/>
      <circle cx="60" cy="60" r="30" stroke="var(--accent)" stroke-width="3" stroke-dasharray="4 7" stroke-linecap="round" opacity=".5"/>
      <path d="M46 61l10 10 19-22" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="98" cy="30" r="4" fill="var(--glow-2)"/><circle cx="22" cy="86" r="5" fill="var(--glow-1)"/><circle cx="100" cy="92" r="3" fill="var(--accent)" opacity=".4"/>
    </svg>`,
  });
  return el("div", { class: "empty" }, art, el("h2", {}, title), el("p", {}, body));
}

/* ---------------- Filters ---------------- */
const FILTERS = ["all", "active", "done"];
function setFilter(f) {
  state.filter = f;
  $("indicator").style.transform = `translateX(${FILTERS.indexOf(f) * 100}%)`;
  $("filters").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filter === f)));
  render();
}
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-filter]");
  if (b) setFilter(b.dataset.filter);
});
$("clearDone").addEventListener("click", () => {
  const ids = state.todos.filter((t) => t.is_complete).map((t) => t.id);
  deleteTodos(ids, `Cleared ${ids.length} completed`);
});

/* ---------------- Composer ---------------- */
const newTitle = $("newTitle"), newDue = $("newDue");
function syncComposer() {
  $("addBtn").disabled = !newTitle.value.trim();
  const info = dueInfo(newDue.value);
  $("dueLabel").textContent = info ? info.label : "Due";
  $("duePill").classList.toggle("set", !!info);
  $("clearDue").hidden = !info;
}
newTitle.addEventListener("input", syncComposer);
newDue.addEventListener("change", syncComposer);
newDue.addEventListener("click", () => { try { newDue.showPicker(); } catch {} });
$("clearDue").addEventListener("click", () => { newDue.value = ""; syncComposer(); });
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const title = newTitle.value.trim();
  if (!title) return;
  addTodo(title, newDue.value);
  newTitle.value = "";
  newDue.value = "";
  syncComposer();
  newTitle.focus();
});

/* ---------------- Keyboard ---------------- */
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (!typing && !e.metaKey && !e.ctrlKey && (e.key === "n" || e.key === "/") && !$("appView").hidden) {
    e.preventDefault();
    newTitle.focus();
  }
  if (e.key === "Escape" && state.openId && !state.editingId) toggleOpen(state.openId);
});

// Refresh relative dates ("Today", greeting) when the tab regains focus.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.user) { renderHero(); render(); }
});
</script>
</body>
</html>
